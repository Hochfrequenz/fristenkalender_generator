name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  black:
    # Job/step names below still say "black"/"isort" on purpose: these are the exact
    # required status check names configured in branch protection. Both now run ruff
    # under the hood. Renaming them requires updating branch protection's required
    # status checks in the same change, so we keep the old labels instead.
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: ruff format --check .
          - tool: isort
            command: ruff check --select I .
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: uv run ${{ matrix.command }}
